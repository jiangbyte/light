[project]
name = "light-fastapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162.0", "uvicorn[standard]>=0.54.0", "pydantic>=2.12"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["types_*", "domain*", "infrastructure*", "apis*", "triggers*", "apps*"]
